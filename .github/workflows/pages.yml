# Deploiement Pages par Actions : publie les fichiers TELS QUELS, sans Jekyll.
# Mis en place le 2026-08-06 apres deux « Page build failed » du pipeline legacy.
#
# ⚠️ On publie un dossier _site SANS l'historique git : `path: .` embarquait .git
# (l'historique de tous les builds, plus lourd que le site) et l'activation du
# deploiement expirait au bout de dix minutes.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparer le site (sans .git ni outillage)
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude _site ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
        with:
          # L'activation a expire deux fois a 10 min : on lui laisse 25.
          timeout: 1500000
