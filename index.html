<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1a12" />
    <title>TFS Acte I</title>

    <!--
      L'APERÇU DU LIEN PARTAGÉ (demande d'Ilias, 16/08 : « quand j'envoie le lien sur
      WhatsApp, ça écrit "Coup franc — prototype du pied" ; je voudrais TFS Acte I »).

      ⚠️ CE N'EST PAS LE <title> QUE LISENT LES MESSAGERIES, C'EST `og:title`. Le titre de
      l'onglet ne leur sert que de repli quand les balises Open Graph manquent — ce qui était
      le cas ici, d'où l'ancien nom affiché. Les deux doivent donc être changés ENSEMBLE :
      corriger le seul <title> marche aujourd'hui et casserait au premier og: ajouté.

      ⚠️ ET `og:image` VEUT UNE URL ABSOLUE. Un chemin relatif est ignoré en silence : le
      robot de WhatsApp ne connaît pas la page d'où il vient. D'où le domaine écrit en dur —
      s'il change, ces trois lignes changent avec lui.
    -->
    <meta property="og:title" content="TFS Acte I" />
    <meta property="og:description" content="Trajectoire : A Football Story — le coup franc. Balaye sur le ballon pour frapper." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://abluedunes.github.io/freekick-plage/" />
    <meta property="og:image" content="https://abluedunes.github.io/freekick-plage/apercu.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TFS Acte I" />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1a12; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      /*
       * RIDEAU IMMÉDIAT — en HTML pur, AUCUN script.
       *
       * Mesuré sur téléphone 4G : 17 s de page BLANCHE avant que le premier écran
       * apparaisse, parce qu'il fallait d'abord télécharger et exécuter le bundle.
       * Devant une page blanche, on n'attend pas : on referme. Ce rideau s'affiche au
       * premier octet de HTML et le jeu le retire quand il prend la main.
       */
      #rideau {
        position: fixed; inset: 0; z-index: 300; display: flex;
        flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: linear-gradient(168deg, #0c2231 0%, #14384a 46%, #c98e4e 130%);
        color: #f4efe6; text-align: center; transition: opacity .4s ease;
      }
      #rideau h1 {
        font: 800 min(46px, 7.6vw)/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: .16em; white-space: nowrap;
      }
      #rideau p { font: italic 400 15px/1 Georgia, serif; color: #9fb4c2; letter-spacing: .12em; }
      #rideau .pt { margin-top: 22px; display: flex; gap: 7px; }
      #rideau .pt i {
        width: 7px; height: 7px; border-radius: 50%; background: #e8c98f;
        animation: bat 1.2s ease-in-out infinite;
      }
      #rideau .pt i:nth-child(2) { animation-delay: .18s }
      #rideau .pt i:nth-child(3) { animation-delay: .36s }
      @keyframes bat { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
    </style>
    <script type="module" crossorigin src="/freekick-plage/assets/index-CfxRdK05.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="rideau">
      <h1>TRAJECTOIRE</h1>
      <p>A Football Story</p>
      <div class="pt"><i></i><i></i><i></i></div>
    </div>
  </body>
</html>
